appId: com.micheal.desktop
productName: Micheal
directories:
  output: release
files:
  - dist/**
  - electron/**
  - package.json
asar: true
win:
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  artifactName: Micheal-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Micheal
linux:
  target:
    - AppImage
mac:
  target:
    - dmg
